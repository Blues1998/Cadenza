<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="__BASE__brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="__BASE__brand/icon-192.png" />
    <link rel="apple-touch-icon" href="__BASE__brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>No such chord · Cadenza</title>

    <!-- Same bootstrap as index.html: the theme is settled before the first
         paint, so arriving here by accident does not flash the wrong one. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cadenza-theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--
      Most of what lands here is not lost, only written the old way.

      Pages serves this file with the address the person actually asked for, so
      a path that names a real destination can be handed to the app as one:
      /Cadenza/songs/sep-08 becomes /Cadenza/#/songs/sep-08 and they arrive
      where they meant to, having seen nothing. Only a path that names nothing
      gets the page below.

      In the head and before any markup, so a translatable address never paints
      the apology first. Replace, not assign: this stop should not be somewhere
      Back can return to.
    -->
    <script>
      window.__cadenza404 = (function () {
        var base = '__BASE__';
        var slugs = __SLUGS__;

        // Read as typed, not as encoded. What comes back is shown with
        // textContent and re-encoded before it is put in a link, so a path
        // full of angle brackets is a curiosity rather than a way in.
        var decode = function (part) {
          try { return decodeURIComponent(part); } catch (e) { return part; }
        };

        var path = location.pathname;
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\/+/, '');
        var parts = rest.split('/').filter(Boolean).map(decode);
        var first = (parts[0] || '').toLowerCase();

        if (first && slugs.indexOf(first) !== -1) {
          var tail = parts.slice(1).map(encodeURIComponent).join('/');
          location.replace(base + location.search + '#/' + first + (tail ? '/' + tail : ''));
          return null;
        }
        return { base: base, slugs: slugs, asked: parts.join('/'), first: first };
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* The app's tokens, only the ones this page uses. It cannot share the
         built stylesheet — that name is content-hashed and this file is
         written before it exists — so the values are repeated here and
         nowhere else. */
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #111214;
        --panel-bg: #17191C;
        --panel-border: #292C30;
        --surface-2: #1D2024;
        --surface-3: #24272C;
        --primary: #FF6A2A;
        --primary-glow: rgba(255, 106, 42, 0.22);
        --text-primary: #F1F0EC;
        --text-secondary: #A9ADB3;
        --text-muted: #85898F;
        --text-on-primary: #111214;
        --string: rgba(241, 240, 236, 0.3);
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #FAFAF8;
        --panel-bg: #FFFFFF;
        --panel-border: #E6E4E0;
        --surface-2: #F4F3F0;
        --surface-3: #E9E7E3;
        --primary: #D9480F;
        --primary-glow: rgba(217, 72, 15, 0.14);
        --text-primary: #17181A;
        --text-secondary: #55585E;
        --text-muted: #85898F;
        --text-on-primary: #FFFFFF;
        --string: rgba(23, 24, 26, 0.3);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem 3rem;
        background: var(--bg);
        color: var(--text-primary);
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .sheet { width: 100%; max-width: 44rem; }

      .top {
        display: flex;
        align-items: center;
        gap: 2.25rem;
        flex-wrap: wrap;
      }

      /* The joke, and the only picture on the page: a chord box drawn to the
         app's own geometry, holding a shape no hand can make. */
      .box { flex: 0 0 auto; }
      .box svg { display: block; overflow: visible; }
      .grid-line { stroke: var(--string); stroke-width: 1.4; }
      .nut { stroke: var(--string); stroke-width: 5; stroke-linecap: round; }
      .mark {
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      .dot { fill: var(--primary); }
      .dot-num {
        fill: var(--text-on-primary);
        font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        text-anchor: middle;
      }
      .name {
        fill: var(--text-primary);
        font-family: 'Space Grotesk', 'Geist', sans-serif;
        font-size: 21px;
        font-weight: 600;
        text-anchor: middle;
        letter-spacing: 0.04em;
      }

      /* Each dot lands in turn, and the last one keeps trying. */
      @keyframes land {
        from { opacity: 0; transform: translateY(-9px) scale(0.6); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes reach {
        0%, 76%, 100% { transform: none; }
        86%           { transform: translateY(5px); }
      }
      .dot-g {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: land 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .dot-g:nth-of-type(1) { animation-delay: 0.10s; }
      .dot-g:nth-of-type(2) { animation-delay: 0.20s; }
      .dot-g:nth-of-type(3) { animation-delay: 0.30s; }
      .dot-g:nth-of-type(4) {
        animation-delay: 0.40s, 1.1s;
        animation-name: land, reach;
        animation-duration: 0.42s, 3.4s;
        animation-iteration-count: 1, infinite;
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), ease-in-out;
      }

      .said { min-width: 15rem; flex: 1 1 16rem; }

      h1 {
        font-family: 'Space Grotesk', 'Geist', sans-serif;
        font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 0.5rem;
      }

      p { margin: 0 0 0.75rem; color: var(--text-secondary); font-size: 0.95rem; }

      code {
        font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
        font-size: 0.85em;
        color: var(--text-primary);
        background: var(--surface-2);
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        padding: 0.1em 0.4em;
        overflow-wrap: anywhere;
      }

      .meant {
        display: inline-block;
        margin-top: 0.25rem;
        padding: 0.5rem 0.85rem;
        border-radius: 9px;
        background: var(--primary-glow);
        border: 1px solid transparent;
        color: var(--text-primary);
        font-size: 0.9rem;
        text-decoration: none;
      }
      .meant strong { color: var(--primary); font-weight: 600; }
      /* The suggestion is display:inline-block, which outranks the browser's
         own rule for [hidden] — without this it shows as an empty pill on
         every address that resembles nothing. */
      .meant[hidden] { display: none; }
      .meant:hover { border-color: var(--primary); }

      .rule {
        margin: 2.25rem 0 1.1rem;
        border: 0;
        border-top: 1px solid var(--panel-border);
      }

      .label {
        font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 0.8rem;
      }

      .ways { display: flex; flex-wrap: wrap; gap: 0.5rem; }

      .way {
        padding: 0.42rem 0.8rem;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--panel-border);
        color: var(--text-secondary);
        font-size: 0.85rem;
        text-decoration: none;
        transition: color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
      }
      .way:hover { background: var(--surface-3); border-color: var(--primary); color: var(--text-primary); }
      .way.is-home { color: var(--text-primary); border-color: var(--panel-border); }
      .way.is-home::before { content: '←'; margin-right: 0.4rem; color: var(--primary); }

      :where(a):focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .dot-g { opacity: 1; animation: none; }
      }

      @media (max-width: 460px) {
        .top { gap: 1.5rem; }
        .box svg { width: 128px; height: auto; }
      }
    </style>
  </head>

  <body>
    <main class="sheet">
      <div class="top">
        <div class="box">
          <!-- Six strings, five frets, the app's own spacing. Four fingers
               spread over five frets: it reads as a chord until you try it. -->
          <svg width="164" height="182" viewBox="0 0 154 172" role="img" aria-label="A chord diagram for a shape no hand can play, named 404">
            <g class="grid-line">
              <line x1="26" y1="30" x2="26" y2="140" />
              <line x1="46" y1="30" x2="46" y2="140" />
              <line x1="66" y1="30" x2="66" y2="140" />
              <line x1="86" y1="30" x2="86" y2="140" />
              <line x1="106" y1="30" x2="106" y2="140" />
              <line x1="126" y1="30" x2="126" y2="140" />
              <line x1="26" y1="52" x2="126" y2="52" />
              <line x1="26" y1="74" x2="126" y2="74" />
              <line x1="26" y1="96" x2="126" y2="96" />
              <line x1="26" y1="118" x2="126" y2="118" />
              <line x1="26" y1="140" x2="126" y2="140" />
            </g>
            <line class="nut" x1="26" y1="31" x2="126" y2="31" />

            <!-- Low E silent, high e open: the two strings nobody is holding. -->
            <g class="mark">
              <line x1="21" y1="14" x2="31" y2="24" />
              <line x1="31" y1="14" x2="21" y2="24" />
              <circle cx="126" cy="19" r="5" />
            </g>

            <g class="dot-g"><circle class="dot" cx="46" cy="41" r="8" /><text class="dot-num" x="46" y="45">1</text></g>
            <g class="dot-g"><circle class="dot" cx="66" cy="85" r="8" /><text class="dot-num" x="66" y="89">2</text></g>
            <g class="dot-g"><circle class="dot" cx="86" cy="129" r="8" /><text class="dot-num" x="86" y="133">3</text></g>
            <g class="dot-g"><circle class="dot" cx="106" cy="63" r="8" /><text class="dot-num" x="106" y="67">4</text></g>

            <text class="name" x="76" y="166">404</text>
          </svg>
        </div>

        <div class="said">
          <h1>No such chord.</h1>
          <p id="asked">That address doesn't name anything here.</p>
          <a class="meant" id="meant" hidden></a>
        </div>
      </div>

      <hr class="rule" />
      <p class="label">Everywhere that does exist</p>
      <!-- Written into the file at build time from the same list the app
           routes on, so the way out of here does not depend on any of the
           script below having run. -->
      <nav class="ways">__WAYS__</nav>
    </main>

    <script>
      (function () {
        var state = window.__cadenza404;
        if (!state) return;   // already on its way somewhere real

        // The slugs were chosen to read as the labels on the rail, which is
        // why a destination can be named from its address alone.
        var titled = function (slug) {
          return slug.split('-').map(function (word) {
            return word.charAt(0).toUpperCase() + word.slice(1);
          }).join(' ');
        };

        // textContent throughout: every string below came out of the address
        // bar, which is to say out of nobody we know.
        if (state.asked) {
          var p = document.getElementById('asked');
          p.textContent = 'Nothing here answers to ';
          var code = document.createElement('code');
          code.textContent = '/' + state.asked;
          p.appendChild(code);
          p.appendChild(document.createTextNode('.'));
        }

        // How many single-character edits apart two words are, capped — a
        // near miss is worth offering, a different word is not.
        var distance = function (a, b) {
          var row = [];
          for (var j = 0; j <= b.length; j++) row[j] = j;
          for (var i = 1; i <= a.length; i++) {
            var prev = row[0];
            row[0] = i;
            for (var k = 1; k <= b.length; k++) {
              var was = row[k];
              row[k] = Math.min(
                row[k] + 1,
                row[k - 1] + 1,
                prev + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1)
              );
              prev = was;
            }
          }
          return row[b.length];
        };

        var near = null;
        var best = 3;
        if (state.first) {
          for (var i = 0; i < state.slugs.length; i++) {
            var d = distance(state.first, state.slugs[i]);
            if (d < best) { best = d; near = state.slugs[i]; }
          }
        }
        if (near) {
          var meant = document.getElementById('meant');
          meant.href = state.base + '#/' + near;
          meant.appendChild(document.createTextNode('Did you mean '));
          var strong = document.createElement('strong');
          strong.textContent = titled(near);
          meant.appendChild(strong);
          meant.appendChild(document.createTextNode('?'));
          meant.hidden = false;
        }

      })();
    </script>
  </body>
</html>
