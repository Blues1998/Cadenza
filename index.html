    <title>Cadenza - Music Lab</title>
    <meta name="description" content="An interactive music theory companion: fretboard, circle of fifths, ear training, and a keyboard-driven rhythm game, in light and dark themes." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cadenza-theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
